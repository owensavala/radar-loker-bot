name: Radar Loker Bot (Automated Scheduler)

on:
  schedule:
    # Berjalan otomatis setiap jam 22:00 UTC (07:00 Pagi WIT / Waktu Indonesia Timur)
    - cron: '0 22 * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual via dashboard GitHub Actions

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: Setup Lingkungan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Jalankan Radar Loker Bot
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
        run: python radar_loker.py
